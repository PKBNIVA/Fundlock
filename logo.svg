<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 2s ease-in-out infinite}
    .shackle{transform-box:fill-box;transform-origin:50% 100%;stroke-dasharray:1 1;animation:lock 3s ease-in-out infinite}
    .note{transform-box:fill-box;transform-origin:50% 50%;animation:float 2.4s ease-in-out infinite}
    .n2{animation-delay:-.8s}.n3{animation-delay:-1.6s}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.95)}}
    @keyframes lock{0%,100%{stroke-dasharray:.7 1;transform:rotate(-6deg)}45%,60%{stroke-dasharray:1 1;transform:rotate(0)}}
    @keyframes float{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(4.5px);opacity:.85}}
  </style>
  <rect class="body" x="12" y="18" width="16" height="14" rx="2" fill="url(#g1)"/>
  <path class="shackle" d="M16 18V13C16 10.7909 17.7909 9 20 9C22.2091 9 24 10.7909 24 13V18" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round" pathLength="1"/>
  <circle cx="20" cy="24" r="2" fill="white" opacity="0.9"/>
  <rect x="19" y="24" width="2" height="4" rx="1" fill="white" opacity="0.9"/>
  <g class="note n1"><rect x="11" y="20" width="10" height="6" rx="1" fill="#10B981" stroke="#34D399" stroke-width="0.5"/><text x="13" y="25" font-size="4" fill="white" font-weight="bold" font-family="Arial,sans-serif">₹</text></g>
  <g class="note n2"><rect x="21" y="22" width="8" height="5" rx="1" fill="#34D399" stroke="#6EE7B7" stroke-width="0.5"/><text x="22.5" y="26" font-size="3.5" fill="white" font-weight="bold" font-family="Arial,sans-serif">₹</text></g>
  <g class="note n3"><rect x="16" y="24" width="7" height="4" rx="0.8" fill="#6EE7B7" stroke="#A7F3D0" stroke-width="0.4"/><text x="17.2" y="27.2" font-size="3" fill="#047857" font-weight="bold" font-family="Arial,sans-serif">₹</text></g>
  <defs>
    <linearGradient id="g1" x1="12" y1="18" x2="28" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="g2" x1="16" y1="9" x2="24" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  </defs>
</svg>
